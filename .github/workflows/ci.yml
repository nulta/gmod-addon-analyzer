name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build --nologo
      - name: Vulnerable dependency scan (incl. transitives)
        run: dotnet list src/GmodAddonAnalyzer/GmodAddonAnalyzer.csproj package --vulnerable --include-transitive
      - name: Test
        run: dotnet test --no-build --nologo